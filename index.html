<!DOCTYPE html>
<html lang="ru">
 a<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Roblox 3D Ultimate</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: #1a1a2e; color: #fff; overflow-x: hidden; }
.navbar { display: flex; align-items: center; padding: 12px 24px; background: linear-gradient(135deg, #16213e, #1a1a2e); border-bottom: 2px solid #00d9ff; position: sticky; top: 0; z-index: 100; }
.logo { font-size: 26px; font-weight: 800; margin-right: 30px; background: linear-gradient(90deg, #00d9ff, #7b2cbf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.container { display: flex; min-height: calc(100vh - 65px); }
.sidebar { width: 240px; padding: 24px 0; background: linear-gradient(180deg, #16213e, #1a1a2e); border-right: 2px solid #00d9ff; }
.sidebar-item { padding: 12px 24px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.3s; color: #fff; margin: 4px 12px; border-radius: 10px; }
.sidebar-item:hover { background: rgba(0,217,255,0.2); }
.sidebar-item.active { background: linear-gradient(90deg, #00d9ff, #7b2cbf); font-weight: 700; }
.main-content { flex: 1; padding: 28px; overflow-y: auto; }
.section-title { font-size: 24px; font-weight: 700; margin: 24px 0 18px; color: #00d9ff; }
.games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
.game-card { cursor: pointer; transition: transform 0.3s; background: #16213e; border-radius: 15px; overflow: hidden; border: 2px solid #00d9ff; }
.game-card:hover { transform: translateY(-8px); box-shadow: 0 10px 30px rgba(0,217,255,0.3); }
.game-thumb { width: 100%; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; font-size: 56px; }
.game-info { padding: 14px; }
.game-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.game-meta { font-size: 12px; color: #00d9ff; }

/* РЕГИСТРАЦИЯ */
#reg-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(5px); }
.reg-box { background: linear-gradient(135deg, #16213e, #1a1a2e); padding: 36px; border-radius: 16px; text-align: center; max-width: 400px; width: 90%; border: 2px solid #00d9ff; }
.reg-box h2 { margin-bottom: 16px; font-size: 28px; color: #00d9ff; }
.reg-input { width: 100%; padding: 14px; margin: 12px 0; border: 2px solid #00d9ff; border-radius: 10px; font-size: 16px; outline: none; background: rgba(0,217,255,0.1); color: #fff; }
.reg-btn { width: 100%; padding: 14px; margin-top: 12px; background: linear-gradient(90deg, #00d9ff, #7b2cbf); color: #fff; border: none; border-radius: 10px; font-weight: 700; font-size: 17px; cursor: pointer; transition: 0.3s; }
.reg-btn:hover { transform: scale(1.02); }
.reg-btn:disabled { background: #555; cursor: not-allowed; transform: none; }
.reg-error { color: #ff6b6b; font-size: 14px; min-height: 20px; margin-top: 8px; }

/* ИГРА */
#game-ui { position: fixed; inset: 0; display: none; background: #000; z-index: 2000; }
#game-canvas { width: 100%; height: 100%; display: block; }
#exit-game { position: fixed; top: 20px; left: 20px; padding: 12px 22px; background: #ff4757; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; z-index: 10; font-weight: 700; }
#hud-info { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: #00d9ff; padding: 10px 18px; border-radius: 10px; font-size: 15px; z-index: 10; border: 2px solid #00d9ff; }
#chat-box { position: fixed; top: 80px; left: 20px; width: 300px; max-height: 180px; overflow-y: auto; background: rgba(22,33,62,0.9); border-radius: 12px; padding: 12px; font-size: 13px; color: #fff; z-index: 10; border: 2px solid #00d9ff; }
#chat-input { width: 100%; padding: 8px; background: rgba(0,217,255,0.1); border: 2px solid #00d9ff; color: #fff; border-radius: 6px; margin-top: 8px; outline: none; }
.msg { margin: 4px 0; padding: 4px 8px; background: rgba(0,0,0,0.3); border-radius: 6px; }
.msg .n { font-weight: bold; color: #00d9ff; }
.msg.sys { color: #2ed573; font-style: italic; }
</style>
</head>
<body>

<div id="reg-modal">
  <div class="reg-box">
    <h2>🎮 Добро пожаловать!</h2>
    <p style="color:#aaa;margin-bottom:16px">Введите никнейм для входа</p>
    <input type="text" id="reg-input" class="reg-input" placeholder="Никнейм" maxlength="16" autocomplete="off">
    <div id="reg-error" class="reg-error"></div>
    <button id="reg-btn" class="reg-btn" disabled>Играть</button>
  </div>
</div>

<nav class="navbar">
  <div class="logo">🧱 ROBLOX 3D</div>
</nav>

<div class="container">
  <aside class="sidebar">
    <div class="sidebar-item active"><span>🏠 Главная</span></div>
    <div class="sidebar-item"><span>🛠️ Studio</span></div>
  </aside>

  <main class="main-content">
    <h2 class="section-title">🔥 Популярные игры</h2>
    <div class="games-grid">
      <div class="game-card" data-game="shooter">
        <div class="game-thumb" style="background: linear-gradient(135deg, #ff4757, #ff6b81)">🔫</div>
        <div class="game-info"><div class="game-title">Team Shooter</div><div class="game-meta">👍 95% • 👥 89K</div></div>
      </div>
      <div class="game-card" data-game="brookhaven">
        <div class="game-thumb" style="background: linear-gradient(135deg, #2ed573, #7bed9f)">🏡</div>
        <div class="game-info"><div class="game-title">Brookhaven RP</div><div class="game-meta">👍 98% • 👥 125K</div></div>
      </div>
      <div class="game-card" data-game="cheese">
        <div class="game-thumb" style="background: linear-gradient(135deg, #ffa502, #ffcc00)">🧀</div>
        <div class="game-info"><div class="game-title">Horror of Cheese</div><div class="game-meta">👍 96% • 👥 45K</div></div>
      </div>
      <div class="game-card" data-game="airplane">
        <div class="game-thumb" style="background: linear-gradient(135deg, #3742fa, #5352ed)">✈️</div>
        <div class="game-info"><div class="game-title">Airplane Simulator</div><div class="game-meta">👍 94% • 👥 52K</div></div>
      </div>
      <div class="game-card" data-game="racing">
        <div class="game-thumb" style="background: linear-gradient(135deg, #ff6348, #ff4757)">🏎️</div>
        <div class="game-info"><div class="game-title">Kart Racing</div><div class="game-meta">👍 97% • 👥 78K</div></div>
      </div>
    </div>
  </main>
</div>

<div id="game-ui">
  <canvas id="game-canvas"></canvas>
  <button id="exit-game" onclick="exitGame()">🏠 В меню</button>
  <div id="hud-info">Игроков: <span id="player-count">1</span></div>
  <div id="chat-box">
    <div id="chat-messages"></div>
    <input type="text" id="chat-input" placeholder="Написать сообщение...">
  </div>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { EffectComposer } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
import { ShaderPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/ShaderPass.js';
import { FXAAShader } from 'https://unpkg.com/three@0.160.0/examples/jsm/shaders/FXAAShader.js';

const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 768;
const State = {
  ws: null, playerId: null, playerName: '', currentGame: null,
  scene: null, camera: null, renderer: null, composer: null, playerMesh: null,
  otherPlayers: new Map(), keys: {}, yaw: 0, pitch: 0, chatInitialized: false
};

const DOM = {
  regModal: document.getElementById('reg-modal'),
  regInput: document.getElementById('reg-input'),
  regBtn: document.getElementById('reg-btn'),
  regError: document.getElementById('reg-error'),
  gameUI: document.getElementById('game-ui'),
  canvas: document.getElementById('game-canvas'),
  chatMessages: document.getElementById('chat-messages'),
  chatInput: document.getElementById('chat-input'),
  playerCount: document.getElementById('player-count')
};

// ===== 100% РАБОЧАЯ РЕГИСТРАЦИЯ =====
function initRegistration() {
  const saved = localStorage.getItem('r3d_name');
  if (saved && saved.length >= 2 && saved.length <= 16) {
    State.playerName = saved;
    DOM.regModal.style.display = 'none';
    return;
  }

  DOM.regInput.addEventListener('input', () => {
    const v = DOM.regInput.value.trim();
    if (v.length >= 2 && v.length <= 16) {
      DOM.regError.textContent = '';
      DOM.regBtn.disabled = false;
    } else {
      DOM.regError.textContent = v.length === 0 ? '' : (v.length < 2 ? 'Минимум 2 символа' : 'Максимум 16');
      DOM.regBtn.disabled = true;
    }
  });

  // Прямое назначение события клика без конфликтов
  DOM.regBtn.onclick = () => {
    const name = DOM.regInput.value.trim();
    if (name.length >= 2 && name.length <= 16) {
      State.playerName = name;
      localStorage.setItem('r3d_name', name);
      DOM.regModal.style.display = 'none';
      console.log("Игрок зарегистрирован:", State.playerName);
    }
  };
  
  DOM.regInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !DOM.regBtn.disabled) {
      DOM.regBtn.onclick();
    }
  });
  
  setTimeout(() => DOM.regInput.focus(), 100);
}

document.querySelectorAll('.game-card').forEach(card => {
  card.addEventListener('click', () => {
    if (card.dataset.game) startGame(card.dataset.game);
  });
});

function startGame(gameId) {
  State.currentGame = gameId;
  DOM.gameUI.style.display = 'block';
  init3D(gameId);
  connectToServer();
}

window.exitGame = function() {
  if (State.ws) { State.ws.close(); State.ws = null; }
  if (State.renderer) { State.renderer.dispose(); State.renderer = null; }
  if (State.scene) {
    State.scene.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
        else obj.material.dispose();
      }
    });
    State.scene = null;
  }
  State.otherPlayers.clear();
  State.playerMesh = null;
  State.chatInitialized = false;
  DOM.gameUI.style.display = 'none';
  DOM.chatMessages.innerHTML = '';
  State.currentGame = null;
};

function connectToServer() {
  if (State.ws && State.ws.readyState === 1) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  State.ws = new WebSocket(`${proto}//${location.host}`);

  State.ws.onopen = () => {
    State.ws.send(JSON.stringify({ type: 'register', name: State.playerName }));
  };

  State.ws.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'registered') {
        State.playerId = d.id;
        State.ws.send(JSON.stringify({ type: 'join', gameId: State.currentGame }));
        addChat('sys', `Добро пожаловать, ${d.name}!`);
      }
      if (d.type === 'snapshot') {
        DOM.playerCount.textContent = d.players.length + 1;
        d.players.forEach(p => {
          if (!State.otherPlayers.has(p.id)) {
            const geo = new THREE.CapsuleGeometry(0.5, 1.5, 4, 8);
            const color = p.team === 'red' ? 0xff4757 : (p.team === 'blue' ? 0x3742fa : 0x2ed573);
            const mat = new THREE.MeshStandardMaterial({ color, metalness: 0.3, roughness: 0.4 });
            const m = new THREE.Mesh(geo, mat);
            m.position.set(p.x, 1.25, p.z);
            m.rotation.y = -p.yaw;
            m.castShadow = true;
            State.scene.add(m);
            State.otherPlayers.set(p.id, m);
          } else {
            const m = State.otherPlayers.get(p.id);
            m.position.set(p.x, p.y, p.z);
            m.rotation.y = -p.yaw;
          }
        });
      }
      if (d.type === 'chat') addChat(d.name, d.msg);
    } catch (err) { console.error('WS:', err); }
  };

  State.ws.onclose = () => {
    setTimeout(() => { if (State.currentGame) connectToServer(); }, 3000);
  };
}

function init3D(gameId) {
  const cv = DOM.canvas;
  cv.width = window.innerWidth;
  cv.height = window.innerHeight;

  State.scene = new THREE.Scene();
  const skyColor = gameId === 'shooter' ? 0x2d3436 : (gameId === 'cheese' ? 0x1a1a2e : 0x74b9ff);
  State.scene.background = new THREE.Color(skyColor);
  
  // ТУМАН ДЛЯ ГЛУБИНЫ (Премиум эффект)
  State.scene.fog = new THREE.Fog(skyColor, 15, 70);

  State.camera = new THREE.PerspectiveCamera(70, cv.width / cv.height, 0.1, 200);
  
  // ВКЛЮЧЕНИЕ СГЛАЖИВАНИЯ И ВЫСОКОЙ ПРОИЗВОДИТЕЛЬНОСТИ
  State.renderer = new THREE.WebGLRenderer({ 
    canvas: cv, 
    antialias: true, 
    powerPreference: "high-performance" 
  });
  State.renderer.setSize(cv.width, cv.height);
  State.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Ограничиваем до 2x для производительности
  State.renderer.shadowMap.enabled = true;
  State.renderer.shadowMap.type = THREE.PCFSoftShadowMap; // МЯГКИЕ ТЕНИ

  State.scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(20, 30, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 100;
  sun.shadow.camera.left = -50;
  sun.shadow.camera.right = 50;
  sun.shadow.camera.top = 50;
  sun.shadow.camera.bottom = -50;
  State.scene.add(sun);

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 100),
    new THREE.MeshStandardMaterial({ color: gameId === 'shooter' ? 0x636e72 : 0x4caf50, roughness: 0.8, metalness: 0.1 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  State.scene.add(floor);

  const grid = new THREE.GridHelper(100, 20, 0x00d9ff, 0x00d9ff);
  grid.position.y = 0.01;
  State.scene.add(grid);

  const playerGeo = new THREE.CapsuleGeometry(0.5, 1.5, 4, 8);
  const playerMat = new THREE.MeshStandardMaterial({ color: 0x00d9ff, metalness: 0.3, roughness: 0.4 });
  State.playerMesh = new THREE.Mesh(playerGeo, playerMat);
  State.playerMesh.position.y = 1.25;
  State.playerMesh.castShadow = true;
  State.scene.add(State.playerMesh);

  setupInput();
  
  // ===== НАСТРОЙКА FXAA (СГЛАЖИВАНИЕ) =====
  State.composer = new EffectComposer(State.renderer);
  State.composer.addPass(new RenderPass(State.scene, State.camera));
  
  const fxaaPass = new ShaderPass(FXAAShader);
  const pixelRatio = State.renderer.getPixelRatio();
  fxaaPass.material.uniforms['resolution'].value.x = 1 / (cv.width * pixelRatio);
  fxaaPass.material.uniforms['resolution'].value.y = 1 / (cv.height * pixelRatio);
  State.composer.addPass(fxaaPass);

  gameLoop();
}

function setupInput() {
  document.addEventListener('keydown', e => { 
    State.keys[e.code] = true;
    if (e.code === 'Enter' && e.target === DOM.chatInput) e.preventDefault();
  });
  document.addEventListener('keyup', e => { State.keys[e.code] = false; });
  document.addEventListener('mousemove', e => {
    if (document.pointerLockElement) {
      State.yaw -= e.movementX * 0.002;
      State.pitch = Math.max(-1.2, Math.min(1.2, State.pitch - e.movementY * 0.002));
    }
  });
  document.addEventListener('click', () => {
    if (!document.pointerLockElement && State.renderer?.domElement) {
      State.renderer.domElement.requestPointerLock();
    }
  });

  if (!State.chatInitialized) {
    DOM.chatInput.addEventListener('keypress', e => {
      if (e.key === 'Enter' && e.target.value.trim() && State.ws?.readyState === 1) {
        State.ws.send(JSON.stringify({ type: 'chat', msg: e.target.value.trim() }));
        e.target.value = '';
      }
    });
    State.chatInitialized = true;
  }
}

let lastTime = 0;
function gameLoop(t) {
  if (!State.playerMesh) { requestAnimationFrame(gameLoop); return; }
  const dt = Math.min((t - lastTime) / 1000, 0.1);
  lastTime = t;

  const f = (State.keys['KeyW'] ? 1 : 0) - (State.keys['KeyS'] ? 1 : 0);
  const r = (State.keys['KeyD'] ? 1 : 0) - (State.keys['KeyA'] ? 1 : 0);
  const speed = 0.2;

  const newX = State.playerMesh.position.x + (f * Math.sin(State.yaw) + r * Math.cos(State.yaw)) * speed;
  const newZ = State.playerMesh.position.z + (f * Math.cos(State.yaw) - r * Math.sin(State.yaw)) * speed;
  
  State.playerMesh.position.x = Math.max(-48, Math.min(48, newX));
  State.playerMesh.position.z = Math.max(-48, Math.min(48, newZ));

  if (State.keys['Space'] && State.playerMesh.position.y <= 1.3) {
    State.playerMesh.position.y = 3.5;
    State.keys['Space'] = false;
  }
  if (State.playerMesh.position.y > 1.25) State.playerMesh.position.y -= 0.25;
  if (State.playerMesh.position.y < 1.25) State.playerMesh.position.y = 1.25;

  State.playerMesh.rotation.y = State.yaw;

  const cd = 7, ch = 4;
  State.camera.position.set(
    State.playerMesh.position.x + Math.sin(State.yaw) * cd,
    State.playerMesh.position.y + ch + Math.sin(State.pitch) * 1.5,
    State.playerMesh.position.z + Math.cos(State.yaw) * cd
  );
  State.camera.lookAt(State.playerMesh.position.x, State.playerMesh.position.y + 1.5, State.playerMesh.position.z);

  if (State.ws && State.ws.readyState === 1) {
    State.ws.send(JSON.stringify({ type: 'input', f: f, r: r, jump: State.keys['Space'], yaw: State.yaw }));
    State.keys['Space'] = false;
  }

  // ИСПОЛЬЗУЕМ COMPOSER ВМЕСТО ОБЫЧНОГО RENDER ДЛЯ FXAA
  State.composer.render();
  requestAnimationFrame(gameLoop);
}

function addChat(name, msg) {
  const d = document.createElement('div');
  d.className = 'msg';
  if (name === 'sys') {
    d.classList.add('sys');
    d.textContent = msg;
  } else {
    d.innerHTML = `<span class="n">${name}:</span> ${msg}`;
  }
  DOM.chatMessages.appendChild(d);
  DOM.chatMessages.scrollTop = DOM.chatMessages.scrollHeight;
  if (DOM.chatMessages.children.length > 50) DOM.chatMessages.removeChild(DOM.chatMessages.firstChild);
}

window.addEventListener('resize', () => {
  if (State.camera && State.renderer) {
    const cv = DOM.canvas;
    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
    State.camera.aspect = window.innerWidth / window.innerHeight;
    State.camera.updateProjectionMatrix();
    State.renderer.setSize(window.innerWidth, window.innerHeight);
    if (State.composer) {
      State.composer.setSize(window.innerWidth, window.innerHeight);
      const pixelRatio = State.renderer.getPixelRatio();
      State.composer.passes[1].material.uniforms['resolution'].value.x = 1 / (cv.width * pixelRatio);
      State.composer.passes[1].material.uniforms['resolution'].value.y = 1 / (cv.height * pixelRatio);
    }
  }
});

initRegistration();
</script>
</body>
</html>
